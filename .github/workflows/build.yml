      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GardeTel.apk
          gh release create "v${{ github.run_number }}" GardeTel.apk --title "Garde Tél ${{ github.run_number }}" --notes "Télécharge GardeTel.apk sur le téléphone et installe-le." --latest
