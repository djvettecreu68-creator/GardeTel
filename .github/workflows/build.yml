name: Construire l'APK Garde Tél

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer le projet Android
        run: |
          mkdir -p "$(dirname "app/build.gradle")"
          cat > 'app/build.gradle' <<'GT_EOF_0'
          plugins { id 'com.android.application' }

          android {
              namespace 'fr.gardetel.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'fr.gardetel.app'
                  minSdk 29
                  targetSdk 34
                  versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
                  versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
              }
              signingConfigs {
                  fixed {
                      storeFile file('gt.keystore')
                      storePassword 'gardetel'
                      keyAlias 'gt'
                      keyPassword 'gardetel'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixed }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GT_EOF_0
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > 'app/src/main/AndroidManifest.xml' <<'GT_EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="Garde Tél"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver
                      android:name=".GardeWidget"
                      android:exported="false"
                      android:label="Garde Tél">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/garde_widget_info" />
                  </receiver>
                  <service
                      android:name=".GuardService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Surveillance de mouvement anti-vol avec alerte sonore" />
                  </service>
                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
                  <service
                      android:name=".LockService"
                      android:exported="true"
                      android:label="Garde Tél – veille auto"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/lock_service" />
                  </service>
              </application>
          </manifest>
          GT_EOF_1
          mkdir -p "$(dirname "app/src/main/java/fr/gardetel/app/GuardService.java")"
          cat > 'app/src/main/java/fr/gardetel/app/GuardService.java' <<'GT_EOF_2'
          package fr.gardetel.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.KeyguardManager;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.ServiceInfo;
          import android.graphics.drawable.Icon;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.SystemClock;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          /** Surveille l'accéléromètre en arrière-plan et sonne dans le casque si le téléphone bouge. */
          public class GuardService extends Service implements SensorEventListener {

              public enum State { OFF, PAUSED, ARMING, ACTIVE, ALARM }

              public interface Listener { void onState(State s); }

              public static final String ACTION_START = "fr.gardetel.app.START";
              public static final String ACTION_STOP = "fr.gardetel.app.STOP";
              public static final String ACTION_SILENCE = "fr.gardetel.app.SILENCE";
              public static final String ACTION_TOGGLE = "fr.gardetel.app.TOGGLE";
              public static final String ACTION_AUTO_ON = "fr.gardetel.app.AUTO_ON";
              public static final String ACTION_AUTO_OFF = "fr.gardetel.app.AUTO_OFF";
              public static final String KEY_AUTO = "sentinelle_auto";
              public static final String KEY_LOG = "journal";
              private static final String KEY_PENDING = "alertes_absence";
              private static final String CHANNEL_ALERTS = "garde_alertes";
              private static final int NOTIF_SUMMARY = 43;

              /** Instance en cours (utilisée par l'anti-extinction). */
              public static volatile GuardService inst;
              public static final String PREFS = "garde";
              public static final String KEY_SENS = "sensibilite";
              private static final String CHANNEL = "garde_status";
              private static final int NOTIF_ID = 42;
              private static final long ARM_DELAY_MS = 5000;

              public static volatile State state = State.OFF;
              public static volatile Listener listener;

              /** Sensibilité 1..10 -> seuil 3.0 .. 0.3 m/s² */
              public static float threshold(int sens) { return 3.3f - sens * 0.3f; }

              private SensorManager sm;
              private Sensor accel;
              private PowerManager.WakeLock wakeLock;
              private AlarmSound snd;
              private final Handler handler = new Handler(Looper.getMainLooper());

              private final float[] filt = new float[3];
              private final float[] base = new float[3];
              private final float[] sum = new float[3];
              private int samples;
              private boolean calibrating;
              private float thr = 1.5f;
              private long lastAlarm;
              private boolean screenRx;

              /** Sentinelle auto : écran éteint -> armement, déverrouillage (empreinte/code) -> pause. */
              private final BroadcastReceiver screen = new BroadcastReceiver() {
                  @Override public void onReceive(Context c, Intent i) {
                      String a = i.getAction();
                      if (Intent.ACTION_POWER_DISCONNECTED.equals(a)) {
                          // Gardien de chargeur : câble retiré pendant la surveillance
                          alert("chargeur débranché");
                      } else if (Intent.ACTION_USER_PRESENT.equals(a)) {
                          showSummary();
                          if (isAuto() && state != State.PAUSED && state != State.OFF) pause();
                      } else if (Intent.ACTION_SCREEN_OFF.equals(a) && isAuto() && state == State.PAUSED) {
                          startGuard();
                      }
                  }
              };

              public static boolean isAuto(Context c) {
                  return c.getSharedPreferences(PREFS, MODE_PRIVATE).getBoolean(KEY_AUTO, false);
              }
              private boolean isAuto() { return isAuto(this); }
              private void setAuto(boolean on) {
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit().putBoolean(KEY_AUTO, on).apply();
              }

              @Override public IBinder onBind(Intent i) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  sm = (SensorManager) getSystemService(SENSOR_SERVICE);
                  accel = sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                  snd = new AlarmSound(this);
                  inst = this;
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(
                          new NotificationChannel(CHANNEL, "État de la surveillance", NotificationManager.IMPORTANCE_LOW));
                  nm.createNotificationChannel(
                          new NotificationChannel(CHANNEL_ALERTS, "Alertes pendant ton absence", NotificationManager.IMPORTANCE_HIGH));
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String a = intent != null ? intent.getAction() : null;
                  startFg(); // obligatoire quand le service est lancé au premier plan

                  if (ACTION_AUTO_ON.equals(a)) { setAuto(true); enterAuto(); return START_STICKY; }
                  if (ACTION_AUTO_OFF.equals(a)) {
                      setAuto(false);
                      if (state == State.PAUSED || state == State.OFF) { shutdown(); return START_NOT_STICKY; }
                      return START_STICKY; // une surveillance en cours continue en mode manuel
                  }
                  if (a == null) {
                      // Relancé par Android après un arrêt : on reprend là où on en était
                      if (isAuto()) enterAuto(); else startGuard();
                      return START_STICKY;
                  }
                  if (ACTION_TOGGLE.equals(a)) {
                      // Appui sur le widget
                      if (state == State.OFF || state == State.PAUSED) { startGuard(); lockSoon(); return START_STICKY; }
                      if (state == State.ALARM) { snd.stop(); startGuard(); return START_STICKY; }
                      return disarm();
                  }
                  if (ACTION_STOP.equals(a)) return disarm();
                  if (ACTION_SILENCE.equals(a)) {
                      // Coupe le son et réarme à la nouvelle position (reste actif)
                      snd.stop();
                      startGuard();
                      return START_STICKY;
                  }
                  // ACTION_START : bouton Activer de l'appli
                  boolean fresh = state == State.OFF || state == State.PAUSED;
                  startGuard();
                  if (fresh) lockSoon();
                  return START_STICKY;
              }

              /** Désactiver : en mode sentinelle on se met juste en pause, sinon on arrête tout. */
              private int disarm() {
                  if (isAuto()) { pause(); return START_STICKY; }
                  shutdown();
                  return START_NOT_STICKY;
              }

              /** Démarre la sentinelle : armée tout de suite si le téléphone est verrouillé, sinon en pause. */
              private void enterAuto() {
                  watchScreen();
                  if (state == State.ARMING || state == State.ACTIVE || state == State.ALARM) return;
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  KeyguardManager km = getSystemService(KeyguardManager.class);
                  if (!pm.isInteractive() || km.isKeyguardLocked()) startGuard(); else pause();
              }

              private void pause() {
                  handler.removeCallbacksAndMessages(null);
                  stopSensor();
                  snd.stop();
                  if (wakeLock != null) { if (wakeLock.isHeld()) wakeLock.release(); wakeLock = null; }
                  setState(State.PAUSED);
              }

              private void watchScreen() {
                  if (screenRx) return;
                  IntentFilter f = new IntentFilter(Intent.ACTION_SCREEN_OFF);
                  f.addAction(Intent.ACTION_USER_PRESENT);
                  f.addAction(Intent.ACTION_POWER_DISCONNECTED);
                  registerReceiver(screen, f);
                  screenRx = true;
              }

              private void unwatchScreen() {
                  if (!screenRx) return;
                  try { unregisterReceiver(screen); } catch (Exception ignored) { }
                  screenRx = false;
              }

              /** Met l'écran en veille comme un appui sur le bouton power (si le verrouillage auto est autorisé). */
              private void lockSoon() {
                  handler.postDelayed(LockService::lock, 400);
              }

              private void startGuard() {
                  handler.removeCallbacksAndMessages(null);
                  stopSensor();
                  thr = threshold(getSharedPreferences(PREFS, MODE_PRIVATE).getInt(KEY_SENS, 6));
                  lastAlarm = 0;

                  state = State.ARMING;
                  startFg();
                  tell();

                  if (wakeLock == null) {
                      wakeLock = ((PowerManager) getSystemService(POWER_SERVICE))
                              .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "GardeTel::guard");
                      wakeLock.setReferenceCounted(false);
                      wakeLock.acquire();
                  }
                  snd.prepare();
                  watchScreen();
                  handler.postDelayed(this::beginCalibration, ARM_DELAY_MS);
              }

              private void startFg() {
                  Notification n = buildNotif();
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(NOTIF_ID, n);
                  }
              }

              private void beginCalibration() {
                  if (accel == null) { shutdown(); return; }
                  calibrating = true;
                  samples = 0;
                  sum[0] = 0; sum[1] = 0; sum[2] = 0;
                  sm.registerListener(this, accel, SensorManager.SENSOR_DELAY_UI);
              }

              @Override
              public void onSensorChanged(SensorEvent e) {
                  float[] v = e.values;
                  if (calibrating) {
                      for (int i = 0; i < 3; i++) sum[i] += v[i];
                      samples++;
                      if (samples >= 15) {
                          for (int i = 0; i < 3; i++) { base[i] = sum[i] / samples; filt[i] = base[i]; }
                          calibrating = false;
                          setState(State.ACTIVE);
                      }
                      return;
                  }

                  for (int i = 0; i < 3; i++) filt[i] = filt[i] * 0.7f + v[i] * 0.3f;
                  float dx = filt[0] - base[0], dy = filt[1] - base[1], dz = filt[2] - base[2];
                  double diff = Math.sqrt(dx * dx + dy * dy + dz * dz);
                  long now = SystemClock.elapsedRealtime();

                  if (diff > thr) {
                      if (now - lastAlarm > snd.burstMs() + 300) {
                          lastAlarm = now;
                          snd.play();
                      }
                      if (state != State.ALARM) { logAlert("bougé"); setState(State.ALARM); }
                  } else if (state == State.ALARM && now - lastAlarm > snd.burstMs() + 3500) {
                      setState(State.ACTIVE);
                  }
              }

              @Override public void onAccuracyChanged(Sensor s, int accuracy) { }

              /** Alarme déclenchée par autre chose qu'un mouvement (chargeur, tentative d'extinction). */
              public void alert(String reason) {
                  handler.post(() -> {
                      if (state != State.ARMING && state != State.ACTIVE && state != State.ALARM) return;
                      logAlert(reason);
                      lastAlarm = SystemClock.elapsedRealtime();
                      snd.play();
                      setState(State.ALARM);
                  });
              }

              /** Note l'alerte dans le journal et dans le résumé à afficher au déverrouillage. */
              private void logAlert(String reason) {
                  String hm = new SimpleDateFormat("HH'h'mm", Locale.FRANCE).format(new Date());
                  String day = new SimpleDateFormat("dd/MM", Locale.FRANCE).format(new Date());
                  android.content.SharedPreferences p = getSharedPreferences(PREFS, MODE_PRIVATE);
                  String log = day + " " + hm + " – " + reason + "\n" + p.getString(KEY_LOG, "");
                  String[] lines = log.split("\n");
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < Math.min(15, lines.length); i++) {
                      if (lines[i].isEmpty()) continue;
                      if (sb.length() > 0) sb.append('\n');
                      sb.append(lines[i]);
                  }
                  String pend = p.getString(KEY_PENDING, "");
                  pend = pend.isEmpty() ? hm + " (" + reason + ")" : pend + ", " + hm + " (" + reason + ")";
                  p.edit().putString(KEY_LOG, sb.toString()).putString(KEY_PENDING, pend).apply();
              }

              /** Au déverrouillage : « ⚠️ 2 alertes pendant ton absence ». */
              private void showSummary() {
                  android.content.SharedPreferences p = getSharedPreferences(PREFS, MODE_PRIVATE);
                  String pend = p.getString(KEY_PENDING, "");
                  if (pend.isEmpty()) return;
                  p.edit().putString(KEY_PENDING, "").apply();
                  int n = pend.split(", ").length;
                  PendingIntent open = PendingIntent.getActivity(this, 5, new Intent(this, MainActivity.class),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification no = new Notification.Builder(this, CHANNEL_ALERTS)
                          .setSmallIcon(R.drawable.ic_notif)
                          .setContentTitle("⚠️ " + n + (n > 1 ? " alertes" : " alerte") + " pendant ton absence")
                          .setContentText("À " + pend)
                          .setStyle(new Notification.BigTextStyle().bigText("À " + pend))
                          .setContentIntent(open)
                          .setAutoCancel(true)
                          .build();
                  getSystemService(NotificationManager.class).notify(NOTIF_SUMMARY, no);
              }

              private void setState(State s) {
                  state = s;
                  if (s != State.OFF) getSystemService(NotificationManager.class).notify(NOTIF_ID, buildNotif());
                  tell();
              }

              private void tell() {
                  Listener l = listener;
                  if (l != null) l.onState(state);
                  GardeWidget.refresh(this);
              }

              private Notification buildNotif() {
                  int fl = PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT;
                  PendingIntent open = PendingIntent.getActivity(this, 0,
                          new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP), fl);
                  PendingIntent stop = PendingIntent.getService(this, 1,
                          new Intent(this, GuardService.class).setAction(ACTION_STOP), fl);
                  PendingIntent silence = PendingIntent.getService(this, 2,
                          new Intent(this, GuardService.class).setAction(ACTION_SILENCE), fl);

                  String title, text;
                  if (state == State.PAUSED) { title = "🔵 Sentinelle auto en pause"; text = "S'arme dès que tu éteins l'écran avec power"; }
                  else if (state == State.ARMING) { title = "🟡 Armement…"; text = "Pose le téléphone, surveillance dans 5 s"; }
                  else if (state == State.ALARM) { title = "🚨 ALERTE : téléphone déplacé !"; text = "« Couper l'alarme » pour réarmer, « Désactiver » pour arrêter"; }
                  else { title = "🟢 Surveillance ACTIVE"; text = "Alerte dans ton casque si on le bouge"; }

                  Notification.Action.Builder ab = new Notification.Action.Builder(
                          Icon.createWithResource(this, R.drawable.ic_notif),
                          state == State.PAUSED ? "Arrêter la sentinelle" : "Désactiver",
                          state == State.PAUSED ? PendingIntent.getService(this, 3,
                                  new Intent(this, GuardService.class).setAction(ACTION_AUTO_OFF), fl) : stop);
                  // Empêche de couper l'alarme depuis l'écran verrouillé
                  if (Build.VERSION.SDK_INT >= 31) ab.setAuthenticationRequired(true);

                  Notification.Builder nb = new Notification.Builder(this, CHANNEL)
                          .setSmallIcon(R.drawable.ic_notif)
                          .setContentTitle(title)
                          .setContentText(text)
                          .setOngoing(true)
                          .setVisibility(Notification.VISIBILITY_PRIVATE)
                          .setContentIntent(open);
                  if (state == State.ALARM) {
                      Notification.Action.Builder sb = new Notification.Action.Builder(
                              Icon.createWithResource(this, R.drawable.ic_notif), "Couper l'alarme", silence);
                      if (Build.VERSION.SDK_INT >= 31) sb.setAuthenticationRequired(true);
                      nb.addAction(sb.build());
                  }
                  nb.addAction(ab.build());
                  return nb.build();
              }

              private void stopSensor() {
                  sm.unregisterListener(this);
                  calibrating = false;
              }

              private void cleanup() {
                  unwatchScreen();
                  handler.removeCallbacksAndMessages(null);
                  stopSensor();
                  snd.stop();
                  if (wakeLock != null) { if (wakeLock.isHeld()) wakeLock.release(); wakeLock = null; }
                  state = State.OFF;
                  tell();
              }

              private void shutdown() {
                  cleanup();
                  stopForeground(STOP_FOREGROUND_REMOVE);
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  if (state != State.OFF) cleanup();
                  snd.release();
                  if (inst == this) inst = null;
                  super.onDestroy();
              }
          }
          GT_EOF_2
          mkdir -p "$(dirname "app/src/main/java/fr/gardetel/app/AlarmSound.java")"
          cat > 'app/src/main/java/fr/gardetel/app/AlarmSound.java' <<'GT_EOF_3'
          package fr.gardetel.app;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.media.AudioAttributes;
          import android.media.AudioDeviceInfo;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioTrack;
          import android.media.MediaPlayer;
          import android.media.RingtoneManager;
          import android.media.ToneGenerator;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.speech.tts.TextToSpeech;

          import java.util.Locale;

          /** Joue le son d'alarme choisi. Sans casque connecté, monte le volume à fond sur le haut-parleur. */
          public class AlarmSound {

              public static final String KEY_SOUND = "son";
              public static final String KEY_RINGTONE = "sonnerie_uri";
              private static final int SR = 44100;
              private static final String PHRASE = "Alerte ! Quelqu'un a pris ton téléphone !";

              private final Context ctx;
              private final AudioManager am;
              private final Handler h = new Handler(Looper.getMainLooper());
              private ToneGenerator tone;
              private AudioTrack track;
              private MediaPlayer player;
              private TextToSpeech tts;
              private boolean ttsReady;
              private int savedVol = -1;
              private final Runnable endBurst = this::stop;

              public AlarmSound(Context c) {
                  ctx = c.getApplicationContext();
                  am = (AudioManager) ctx.getSystemService(Context.AUDIO_SERVICE);
              }

              private SharedPreferences prefs() { return ctx.getSharedPreferences(GuardService.PREFS, Context.MODE_PRIVATE); }

              public String kind() { return prefs().getString(KEY_SOUND, "garde"); }

              /** Durée d'une salve de son, en ms. */
              public long burstMs() {
                  switch (kind()) {
                      case "voix": return 3000;
                      case "sonnerie": return 3000;
                      case "sirene": case "voiture": return 2000;
                      default: return 1500;
                  }
              }

              /** Prépare la voix à l'avance (elle met une seconde à démarrer). */
              public void prepare() {
                  if (!"voix".equals(kind()) || tts != null) return;
                  tts = new TextToSpeech(ctx, st -> {
                      if (st == TextToSpeech.SUCCESS && tts != null) {
                          tts.setLanguage(Locale.FRANCE);
                          tts.setAudioAttributes(new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build());
                          ttsReady = true;
                      }
                  });
              }

              /** Joue une salve du son choisi. */
              public void play() {
                  stop();
                  boostIfNoHeadset();
                  String k = kind();
                  try {
                      switch (k) {
                          case "sirene": playPcm(siren(burstMs())); break;
                          case "voiture": playPcm(car(burstMs())); break;
                          case "voix":
                              prepare();
                              if (ttsReady) {
                                  Bundle b = new Bundle();
                                  b.putInt(TextToSpeech.Engine.KEY_PARAM_STREAM, AudioManager.STREAM_MUSIC);
                                  tts.speak(PHRASE, TextToSpeech.QUEUE_FLUSH, b, "gt");
                              } else playGuard();
                              break;
                          case "sonnerie": playRingtone(); break;
                          default: playGuard();
                      }
                  } catch (Exception e) {
                      playGuard();
                  }
                  h.postDelayed(endBurst, burstMs() + 300);
              }

              public void stop() {
                  h.removeCallbacks(endBurst);
                  if (tone != null) tone.stopTone();
                  if (track != null) { try { track.stop(); } catch (Exception ignored) { } track.release(); track = null; }
                  if (player != null) { try { player.stop(); } catch (Exception ignored) { } player.release(); player = null; }
                  if (tts != null && ttsReady) tts.stop();
                  restoreVolume();
              }

              public void release() {
                  stop();
                  if (tone != null) { tone.release(); tone = null; }
                  if (tts != null) { tts.shutdown(); tts = null; ttsReady = false; }
              }

              // ---- Haut-parleur si le casque est déconnecté ----

              public boolean headsetConnected() {
                  for (AudioDeviceInfo d : am.getDevices(AudioManager.GET_DEVICES_OUTPUTS)) {
                      int t = d.getType();
                      if (t == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP || t == AudioDeviceInfo.TYPE_BLUETOOTH_SCO
                              || t == AudioDeviceInfo.TYPE_WIRED_HEADPHONES || t == AudioDeviceInfo.TYPE_WIRED_HEADSET
                              || t == AudioDeviceInfo.TYPE_USB_HEADSET) return true;
                      if (Build.VERSION.SDK_INT >= 31 && t == AudioDeviceInfo.TYPE_BLE_HEADSET) return true;
                  }
                  return false;
              }

              private void boostIfNoHeadset() {
                  if (headsetConnected()) return;
                  try {
                      if (savedVol < 0) savedVol = am.getStreamVolume(AudioManager.STREAM_MUSIC);
                      am.setStreamVolume(AudioManager.STREAM_MUSIC, am.getStreamMaxVolume(AudioManager.STREAM_MUSIC), 0);
                  } catch (Exception ignored) { }
              }

              private void restoreVolume() {
                  if (savedVol < 0) return;
                  try { am.setStreamVolume(AudioManager.STREAM_MUSIC, savedVol, 0); } catch (Exception ignored) { }
                  savedVol = -1;
              }

              // ---- Les différents sons ----

              private void playGuard() {
                  if (tone == null) {
                      try { tone = new ToneGenerator(AudioManager.STREAM_MUSIC, 100); } catch (Exception e) { return; }
                  }
                  tone.startTone(ToneGenerator.TONE_CDMA_ALERT_CALL_GUARD, 1500);
              }

              private void playRingtone() throws Exception {
                  String u = prefs().getString(KEY_RINGTONE, null);
                  Uri uri = u != null ? Uri.parse(u) : RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                  player = new MediaPlayer();
                  player.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
                  player.setDataSource(ctx, uri);
                  player.setLooping(true);
                  player.prepare();
                  player.start();
              }

              private void playPcm(short[] pcm) {
                  track = new AudioTrack.Builder()
                          .setAudioAttributes(new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build())
                          .setAudioFormat(new AudioFormat.Builder()
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setSampleRate(SR)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                          .setTransferMode(AudioTrack.MODE_STATIC)
                          .setBufferSizeInBytes(pcm.length * 2)
                          .build();
                  track.write(pcm, 0, pcm.length);
                  track.play();
              }

              /** Sirène de police : monte et descend entre 650 et 1300 Hz. */
              private static short[] siren(long ms) {
                  int n = (int) (SR * ms / 1000);
                  short[] out = new short[n];
                  double ph = 0;
                  for (int i = 0; i < n; i++) {
                      double t = (double) i / SR;
                      double f = 650 + 650 * (0.5 - 0.5 * Math.cos(2 * Math.PI * t / 1.0));
                      ph += 2 * Math.PI * f / SR;
                      out[i] = (short) (Math.sin(ph) * 0.9 * fade(i, n) * 32767);
                  }
                  return out;
              }

              /** Alarme de voiture : bips rapides à deux tons. */
              private static short[] car(long ms) {
                  int n = (int) (SR * ms / 1000);
                  int step = (int) (SR * 0.16);
                  short[] out = new short[n];
                  double ph = 0;
                  for (int i = 0; i < n; i++) {
                      double f = ((i / step) % 2 == 0) ? 1500 : 1050;
                      ph += 2 * Math.PI * f / SR;
                      double s = Math.max(-1, Math.min(1, Math.sin(ph) * 1.8)); // son plus agressif
                      out[i] = (short) (s * 0.8 * fade(i, n) * 32767);
                  }
                  return out;
              }

              private static double fade(int i, int n) {
                  int f = SR / 100; // 10 ms
                  if (i < f) return (double) i / f;
                  if (i > n - f) return (double) (n - i) / f;
                  return 1;
              }
          }
