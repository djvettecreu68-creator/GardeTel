          package fr.gardetel.app;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.media.Ringtone;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          /** Affiche index.html et fait le lien entre la page et le service de surveillance. */
          public class MainActivity extends Activity implements GuardService.Listener, SensorEventListener {

              private static final int BG = 0xFF0F1115;
              private WebView web;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private static final int PICK_RINGTONE = 7;
              private AlarmSound sound;
              private SensorManager sm;
              private final float[] fast = new float[3];
              private final float[] slow = new float[3];
              private boolean gaugeInit;
              private long lastGauge;
              private float peak;

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);

                  web = new WebView(this);
                  web.setBackgroundColor(BG);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.addJavascriptInterface(new Bridge(), "Garde");
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
                  sound = new AlarmSound(this);
                  sm = (SensorManager) getSystemService(SENSOR_SERVICE);

                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  GuardService.listener = this;
                  // Sentinelle activée mais service arrêté (redémarrage, appli tuée) : on la relance
                  if (GuardService.isAuto(this) && GuardService.state == GuardService.State.OFF) {
                      startForegroundService(new Intent(this, GuardService.class).setAction(GuardService.ACTION_AUTO_ON));
                  }
                  js("window.gardeRefresh&&gardeRefresh()");
                  // Jauge de réglage : on écoute l'accéléromètre tant que l'appli est affichée
                  Sensor a = sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                  gaugeInit = false;
                  if (a != null) sm.registerListener(this, a, SensorManager.SENSOR_DELAY_UI);
              }

              @Override
              public void onSensorChanged(SensorEvent e) {
                  float[] v = e.values;
                  if (!gaugeInit) {
                      for (int i = 0; i < 3; i++) { fast[i] = v[i]; slow[i] = v[i]; }
                      gaugeInit = true;
                      return;
                  }
                  for (int i = 0; i < 3; i++) {
                      fast[i] = fast[i] * 0.7f + v[i] * 0.3f;   // même filtre que la surveillance
                      slow[i] = slow[i] * 0.99f + v[i] * 0.01f; // position de repos
                  }
                  float dx = fast[0] - slow[0], dy = fast[1] - slow[1], dz = fast[2] - slow[2];
                  float d = (float) Math.sqrt(dx * dx + dy * dy + dz * dz);
                  peak = Math.max(peak, d);
                  long now = System.currentTimeMillis();
                  if (now - lastGauge >= 100) {
                      lastGauge = now;
                      js("window.onGauge&&onGauge(" + peak + ")");
                      peak = 0;
                  }
              }

              @Override public void onAccuracyChanged(Sensor s, int accuracy) { }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != PICK_RINGTONE || res != RESULT_OK || data == null) return;
                  Uri u = data.getParcelableExtra(RingtoneManager.EXTRA_RINGTONE_PICKED_URI);
                  if (u == null) return;
                  getSharedPreferences(GuardService.PREFS, MODE_PRIVATE).edit()
                          .putString(AlarmSound.KEY_RINGTONE, u.toString())
                          .putString(AlarmSound.KEY_SOUND, "sonnerie").apply();
                  js("window.gardeRefresh&&gardeRefresh()");
              }

              @Override
              protected void onPause() {
                  if (GuardService.listener == this) GuardService.listener = null;
                  sm.unregisterListener(this);
                  sound.stop();
                  super.onPause();
              }

              @Override
              public void onState(GuardService.State st) {
                  runOnUiThread(() -> js("window.onGardeState&&onGardeState('" + st.name() + "')"));
              }

              private void js(String code) {
                  if (web != null) web.evaluateJavascript(code, null);
              }

              @Override
              protected void onDestroy() {
                  if (GuardService.listener == this) GuardService.listener = null;
                  if (web != null) { web.destroy(); web = null; }
                  if (sound != null) sound.release();
                  super.onDestroy();
              }

              /** Fonctions appelables depuis la page : Garde.start(), Garde.stop(), etc. */
              class Bridge {
                  @JavascriptInterface public String state() { return GuardService.state.name(); }

                  @JavascriptInterface public void start() {
                      runOnUiThread(() -> startForegroundService(
                              new Intent(MainActivity.this, GuardService.class).setAction(GuardService.ACTION_START)));
                  }

                  @JavascriptInterface public void stop() {
                      runOnUiThread(() -> startService(
                              new Intent(MainActivity.this, GuardService.class).setAction(GuardService.ACTION_STOP)));
                  }

                  @JavascriptInterface public void silence() {
                      runOnUiThread(() -> startService(
                              new Intent(MainActivity.this, GuardService.class).setAction(GuardService.ACTION_SILENCE)));
                  }

                  @JavascriptInterface public int getSens() {
                      return getSharedPreferences(GuardService.PREFS, MODE_PRIVATE).getInt(GuardService.KEY_SENS, 6);
                  }

                  @JavascriptInterface public void setSens(int v) {
                      int c = Math.max(1, Math.min(10, v));
                      getSharedPreferences(GuardService.PREFS, MODE_PRIVATE).edit().putInt(GuardService.KEY_SENS, c).apply();
                  }

                  @JavascriptInterface public void testSound() {
                      runOnUiThread(() -> {
                          sound.prepare();
                          // la voix met un instant à se préparer la première fois
                          handler.postDelayed(sound::play, "voix".equals(sound.kind()) ? 700 : 0);
                      });
                  }

                  @JavascriptInterface public String getSound() { return sound.kind(); }

                  @JavascriptInterface public void setSound(String k) {
                      getSharedPreferences(GuardService.PREFS, MODE_PRIVATE).edit().putString(AlarmSound.KEY_SOUND, k).apply();
                      runOnUiThread(sound::prepare);
                  }

                  @JavascriptInterface public String ringtoneName() {
                      String u = getSharedPreferences(GuardService.PREFS, MODE_PRIVATE).getString(AlarmSound.KEY_RINGTONE, null);
                      if (u == null) return "";
                      try {
                          Ringtone r = RingtoneManager.getRingtone(MainActivity.this, Uri.parse(u));
                          return r != null ? r.getTitle(MainActivity.this) : "";
                      } catch (Exception e) { return ""; }
                  }

                  @JavascriptInterface public void pickRingtone() {
                      runOnUiThread(() -> {
                          String u = getSharedPreferences(GuardService.PREFS, MODE_PRIVATE).getString(AlarmSound.KEY_RINGTONE, null);
                          Intent i = new Intent(RingtoneManager.ACTION_RINGTONE_PICKER)
                                  .putExtra(RingtoneManager.EXTRA_RINGTONE_TYPE, RingtoneManager.TYPE_ALL)
                                  .putExtra(RingtoneManager.EXTRA_RINGTONE_TITLE, "Son de l'alarme")
                                  .putExtra(RingtoneManager.EXTRA_RINGTONE_SHOW_SILENT, false)
                                  .putExtra(RingtoneManager.EXTRA_RINGTONE_SHOW_DEFAULT, false);
                          if (u != null) i.putExtra(RingtoneManager.EXTRA_RINGTONE_EXISTING_URI, Uri.parse(u));
                          try { startActivityForResult(i, PICK_RINGTONE); } catch (Exception ignored) { }
                      });
                  }

                  @JavascriptInterface public boolean headset() { return sound.headsetConnected(); }

                  @JavascriptInterface public String getLog() {
                      return getSharedPreferences(GuardService.PREFS, MODE_PRIVATE).getString(GuardService.KEY_LOG, "");
                  }

                  @JavascriptInterface public void clearLog() {
                      getSharedPreferences(GuardService.PREFS, MODE_PRIVATE).edit().remove(GuardService.KEY_LOG).apply();
                  }

                  @JavascriptInterface public boolean getAuto() { return GuardService.isAuto(MainActivity.this); }

                  @JavascriptInterface public void setAuto(boolean on) {
                      runOnUiThread(() -> startForegroundService(new Intent(MainActivity.this, GuardService.class)
                              .setAction(on ? GuardService.ACTION_AUTO_ON : GuardService.ACTION_AUTO_OFF)));
                  }

                  @JavascriptInterface public boolean lockOk() { return LockService.enabled(); }

                  @JavascriptInterface public void askLock() {
                      runOnUiThread(() -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  }

                  @JavascriptInterface public boolean batteryOk() {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      return pm.isIgnoringBatteryOptimizations(getPackageName());
                  }

                  @SuppressLint("BatteryLife")
                  @JavascriptInterface public void askBattery() {
                      runOnUiThread(() -> {
                          try {
                              startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                      Uri.parse("package:" + getPackageName())));
                          } catch (Exception e) {
                              startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                          }
                      });
                  }
              }
          }
