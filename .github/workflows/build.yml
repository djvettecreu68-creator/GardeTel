          package fr.gardetel.app;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Intent;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          /**
           * Service d'accessibilité de Garde Tél :
           * - met l'écran en veille (comme le bouton power) ;
           * - anti-extinction : ferme le menu « Éteindre / Redémarrer » quand la surveillance est armée.
           */
          public class LockService extends AccessibilityService {

              private static volatile LockService inst;
              private final Handler h = new Handler(Looper.getMainLooper());
              private long lastBlock;

              public static boolean enabled() { return inst != null; }

              public static boolean lock() {
                  LockService s = inst;
                  return s != null && s.performGlobalAction(GLOBAL_ACTION_LOCK_SCREEN);
              }

              @Override protected void onServiceConnected() { super.onServiceConnected(); inst = this; }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent e) {
                  if (e.getEventType() != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return;
                  GuardService.State st = GuardService.state;
                  if (st != GuardService.State.ARMING && st != GuardService.State.ACTIVE && st != GuardService.State.ALARM) return;
                  String pkg = e.getPackageName() != null ? e.getPackageName().toString() : "";
                  if (!pkg.contains("systemui") && !pkg.contains("globalactions")) return;
                  if (!isPowerMenu(e)) return;

                  // Ferme le menu tout de suite, puis encore une fois au cas où il résiste
                  performGlobalAction(GLOBAL_ACTION_BACK);
                  h.postDelayed(() -> performGlobalAction(GLOBAL_ACTION_BACK), 150);
                  long now = System.currentTimeMillis();
                  if (now - lastBlock > 1500) {
                      lastBlock = now;
                      GuardService g = GuardService.inst;
                      if (g != null) g.alert("tentative d'extinction");
                  }
              }

              /** Reconnaît le menu d'extinction : par son nom, ou parce qu'il contient « Éteindre » ET « Redémarrer ». */
              private boolean isPowerMenu(AccessibilityEvent e) {
                  String cls = e.getClassName() != null ? e.getClassName().toString().toLowerCase() : "";
                  if (cls.contains("globalactions")) return true;
                  boolean off = false, restart = false;
                  for (CharSequence c : e.getText()) {
                      String s = c.toString().toLowerCase();
                      off |= isOff(s);
                      restart |= isRestart(s);
                  }
                  if (off && restart) return true;
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  try {
                      off = !root.findAccessibilityNodeInfosByText("Éteindre").isEmpty()
                              || !root.findAccessibilityNodeInfosByText("Power off").isEmpty();
                      restart = !root.findAccessibilityNodeInfosByText("Redémarrer").isEmpty()
                              || !root.findAccessibilityNodeInfosByText("Restart").isEmpty();
                      return off && restart;
                  } catch (Exception ex) {
                      return false;
                  }
              }

              private static boolean isOff(String s) { return s.contains("éteindre") || s.contains("power off"); }
              private static boolean isRestart(String s) { return s.contains("redémarrer") || s.contains("restart"); }

              @Override public void onInterrupt() { }

              @Override public boolean onUnbind(Intent i) { inst = null; return super.onUnbind(i); }
              @Override public void onDestroy() { inst = null; super.onDestroy(); }
          }
