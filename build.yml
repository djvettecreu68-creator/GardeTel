                  <path android:fillColor="#22C55E" android:pathData="M12,1L3,5v6c0,5.55 3.84,10.74 9,12 5.16,-1.26 9,-6.45 9,-12V5l-9,-4z" />
              </group>
          </vector>
          GT_EOF_4
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_notif.xml")"
          cat > 'app/src/main/res/drawable/ic_notif.xml' <<'GT_EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,1L3,5v6c0,5.55 3.84,10.74 9,12 5.16,-1.26 9,-6.45 9,-12V5l-9,-4z" />
          </vector>
          GT_EOF_5
          mkdir -p "$(dirname "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml")"
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'GT_EOF_6'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          GT_EOF_6
          mkdir -p "$(dirname "app/src/main/res/values/colors.xml")"
          cat > 'app/src/main/res/values/colors.xml' <<'GT_EOF_7'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#0F1115</color>
          </resources>
          GT_EOF_7
          mkdir -p "$(dirname "build.gradle")"
          cat > 'build.gradle' <<'GT_EOF_8'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          GT_EOF_8
          mkdir -p "$(dirname "gradle.properties")"
          cat > 'gradle.properties' <<'GT_EOF_9'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          GT_EOF_9
          mkdir -p "$(dirname "settings.gradle")"
          cat > 'settings.gradle' <<'GT_EOF_10'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'GardeTel'
          include ':app'
          GT_EOF_10
          echo "" | base64 -d > app/gt.keystore
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GardeTel.apk
          gh release create "v${{ github.run_number }}" GardeTel.apk --title "Garde Tél ${{ github.run_number }}" --notes "Télécharge GardeTel.apk sur le téléphone et installe-le." --latest
