name: Construire l'APK Garde Tél

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer le projet Android
        run: |
          mkdir -p "$(dirname "app/build.gradle")"
          cat > 'app/build.gradle' <<'GT_EOF_0'
          plugins { id 'com.android.application' }

          android {
              namespace 'fr.gardetel.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'fr.gardetel.app'
                  minSdk 29
                  targetSdk 34
                  versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
                  versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
              }
              signingConfigs {
                  fixed {
                      storeFile file('gt.keystore')
                      storePassword 'gardetel'
                      keyAlias 'gt'
                      keyPassword 'gardetel'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixed }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GT_EOF_0
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > 'app/src/main/AndroidManifest.xml' <<'GT_EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="Garde Tél"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".GuardService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Surveillance de mouvement anti-vol avec alerte sonore" />
                  </service>
              </application>
          </manifest>
          GT_EOF_1
          mkdir -p "$(dirname "app/src/main/java/fr/gardetel/app/GuardService.java")"
          cat > 'app/src/main/java/fr/gardetel/app/GuardService.java' <<'GT_EOF_2'
          package fr.gardetel.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.drawable.Icon;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.media.AudioManager;
          import android.media.ToneGenerator;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.SystemClock;

          /** Surveille l'accéléromètre en arrière-plan et sonne dans le casque si le téléphone bouge. */
          public class GuardService extends Service implements SensorEventListener {

              public enum State { OFF, ARMING, ACTIVE, ALARM }

              public interface Listener { void onState(State s); }

              public static final String ACTION_START = "fr.gardetel.app.START";
              public static final String ACTION_STOP = "fr.gardetel.app.STOP";
              public static final String ACTION_SILENCE = "fr.gardetel.app.SILENCE";
              public static final String PREFS = "garde";
              public static final String KEY_SENS = "sensibilite";
              private static final String CHANNEL = "garde_status";
              private static final int NOTIF_ID = 42;
              private static final long ARM_DELAY_MS = 5000;

              public static volatile State state = State.OFF;
              public static volatile Listener listener;

              /** Sensibilité 1..10 -> seuil 3.0 .. 0.3 m/s² */
              public static float threshold(int sens) { return 3.3f - sens * 0.3f; }

              private SensorManager sm;
              private Sensor accel;
              private PowerManager.WakeLock wakeLock;
              private ToneGenerator tone;
              private final Handler handler = new Handler(Looper.getMainLooper());

              private final float[] filt = new float[3];
              private final float[] base = new float[3];
              private final float[] sum = new float[3];
              private int samples;
              private boolean calibrating;
              private float thr = 1.5f;
              private long lastAlarm;

              @Override public IBinder onBind(Intent i) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  sm = (SensorManager) getSystemService(SENSOR_SERVICE);
                  accel = sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                  getSystemService(NotificationManager.class).createNotificationChannel(
                          new NotificationChannel(CHANNEL, "État de la surveillance", NotificationManager.IMPORTANCE_LOW));
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      shutdown();
                      return START_NOT_STICKY;
                  }
                  if (intent != null && ACTION_SILENCE.equals(intent.getAction()) && tone != null) {
                      // Coupe le son et réarme à la nouvelle position (reste actif)
                      tone.stopTone();
                  }
                  startGuard();
                  return START_STICKY;
              }

              private void startGuard() {
                  handler.removeCallbacksAndMessages(null);
                  stopSensor();
                  thr = threshold(getSharedPreferences(PREFS, MODE_PRIVATE).getInt(KEY_SENS, 6));
                  lastAlarm = 0;

                  state = State.ARMING;
                  Notification n = buildNotif();
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(NOTIF_ID, n);
                  }
                  tell();

                  if (wakeLock == null) {
                      wakeLock = ((PowerManager) getSystemService(POWER_SERVICE))
                              .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "GardeTel::guard");
                      wakeLock.setReferenceCounted(false);
                      wakeLock.acquire();
                  }
                  if (tone == null) {
                      try { tone = new ToneGenerator(AudioManager.STREAM_MUSIC, 100); } catch (Exception e) { tone = null; }
                  }
                  handler.postDelayed(this::beginCalibration, ARM_DELAY_MS);
              }

              private void beginCalibration() {
                  if (accel == null) { shutdown(); return; }
                  calibrating = true;
                  samples = 0;
                  sum[0] = 0; sum[1] = 0; sum[2] = 0;
                  sm.registerListener(this, accel, SensorManager.SENSOR_DELAY_UI);
              }

              @Override
              public void onSensorChanged(SensorEvent e) {
                  float[] v = e.values;
                  if (calibrating) {
                      for (int i = 0; i < 3; i++) sum[i] += v[i];
                      samples++;
                      if (samples >= 15) {
                          for (int i = 0; i < 3; i++) { base[i] = sum[i] / samples; filt[i] = base[i]; }
                          calibrating = false;
                          setState(State.ACTIVE);
                      }
                      return;
                  }

                  for (int i = 0; i < 3; i++) filt[i] = filt[i] * 0.7f + v[i] * 0.3f;
                  float dx = filt[0] - base[0], dy = filt[1] - base[1], dz = filt[2] - base[2];
                  double diff = Math.sqrt(dx * dx + dy * dy + dz * dz);
                  long now = SystemClock.elapsedRealtime();

                  if (diff > thr) {
                      if (now - lastAlarm > 2000) {
                          lastAlarm = now;
                          if (tone != null) tone.startTone(ToneGenerator.TONE_CDMA_ALERT_CALL_GUARD, 1500);
                      }
                      if (state != State.ALARM) setState(State.ALARM);
                  } else if (state == State.ALARM && now - lastAlarm > 5000) {
                      setState(State.ACTIVE);
                  }
              }

              @Override public void onAccuracyChanged(Sensor s, int accuracy) { }

              private void setState(State s) {
                  state = s;
                  if (s != State.OFF) getSystemService(NotificationManager.class).notify(NOTIF_ID, buildNotif());
                  tell();
              }

              private void tell() {
                  Listener l = listener;
                  if (l != null) l.onState(state);
              }

              private Notification buildNotif() {
                  int fl = PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT;
                  PendingIntent open = PendingIntent.getActivity(this, 0,
                          new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP), fl);
                  PendingIntent stop = PendingIntent.getService(this, 1,
                          new Intent(this, GuardService.class).setAction(ACTION_STOP), fl);
                  PendingIntent silence = PendingIntent.getService(this, 2,
                          new Intent(this, GuardService.class).setAction(ACTION_SILENCE), fl);

                  String title, text;
                  if (state == State.ARMING) { title = "🟡 Armement…"; text = "Pose le téléphone, surveillance dans 5 s"; }
                  else if (state == State.ALARM) { title = "🚨 ALERTE : téléphone déplacé !"; text = "« Couper l'alarme » pour réarmer, « Désactiver » pour arrêter"; }
                  else { title = "🟢 Surveillance ACTIVE"; text = "Alerte dans ton casque si on le bouge"; }

                  Notification.Action.Builder ab = new Notification.Action.Builder(
                          Icon.createWithResource(this, R.drawable.ic_notif), "Désactiver", stop);
                  // Empêche de couper l'alarme depuis l'écran verrouillé
                  if (Build.VERSION.SDK_INT >= 31) ab.setAuthenticationRequired(true);

                  Notification.Builder nb = new Notification.Builder(this, CHANNEL)
                          .setSmallIcon(R.drawable.ic_notif)
                          .setContentTitle(title)
                          .setContentText(text)
                          .setOngoing(true)
                          .setVisibility(Notification.VISIBILITY_PRIVATE)
                          .setContentIntent(open);
                  if (state == State.ALARM) {
                      Notification.Action.Builder sb = new Notification.Action.Builder(
                              Icon.createWithResource(this, R.drawable.ic_notif), "Couper l'alarme", silence);
                      if (Build.VERSION.SDK_INT >= 31) sb.setAuthenticationRequired(true);
                      nb.addAction(sb.build());
                  }
                  nb.addAction(ab.build());
                  return nb.build();
              }

              private void stopSensor() {
                  sm.unregisterListener(this);
                  calibrating = false;
              }

              private void cleanup() {
                  handler.removeCallbacksAndMessages(null);
                  stopSensor();
                  if (tone != null) { tone.release(); tone = null; }
                  if (wakeLock != null) { if (wakeLock.isHeld()) wakeLock.release(); wakeLock = null; }
                  state = State.OFF;
                  tell();
              }

              private void shutdown() {
                  cleanup();
                  stopForeground(STOP_FOREGROUND_REMOVE);
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  if (state != State.OFF) cleanup();
                  super.onDestroy();
              }
          }
          GT_EOF_2
          mkdir -p "$(dirname "app/src/main/java/fr/gardetel/app/MainActivity.java")"
          cat > 'app/src/main/java/fr/gardetel/app/MainActivity.java' <<'GT_EOF_3'
          package fr.gardetel.app;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.media.AudioManager;
          import android.media.ToneGenerator;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          /** Affiche index.html et fait le lien entre la page et le service de surveillance. */
          public class MainActivity extends Activity implements GuardService.Listener {

              private static final int BG = 0xFF0F1115;
              private WebView web;
              private final Handler handler = new Handler(Looper.getMainLooper());

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);

                  web = new WebView(this);
                  web.setBackgroundColor(BG);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.addJavascriptInterface(new Bridge(), "Garde");
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");

                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  GuardService.listener = this;
                  js("window.gardeRefresh&&gardeRefresh()");
              }

              @Override
              protected void onPause() {
                  if (GuardService.listener == this) GuardService.listener = null;
                  super.onPause();
              }

              @Override
              public void onState(GuardService.State st) {
                  runOnUiThread(() -> js("window.onGardeState&&onGardeState('" + st.name() + "')"));
              }

              private void js(String code) {
                  if (web != null) web.evaluateJavascript(code, null);
              }

              @Override
              protected void onDestroy() {
                  if (GuardService.listener == this) GuardService.listener = null;
                  if (web != null) { web.destroy(); web = null; }
                  super.onDestroy();
              }

              /** Fonctions appelables depuis la page : Garde.start(), Garde.stop(), etc. */
              class Bridge {
                  @JavascriptInterface public String state() { return GuardService.state.name(); }

                  @JavascriptInterface public void start() {
                      runOnUiThread(() -> startForegroundService(
                              new Intent(MainActivity.this, GuardService.class).setAction(GuardService.ACTION_START)));
                  }

                  @JavascriptInterface public void stop() {
                      runOnUiThread(() -> startService(
                              new Intent(MainActivity.this, GuardService.class).setAction(GuardService.ACTION_STOP)));
                  }

                  @JavascriptInterface public void silence() {
                      runOnUiThread(() -> startService(
                              new Intent(MainActivity.this, GuardService.class).setAction(GuardService.ACTION_SILENCE)));
                  }

                  @JavascriptInterface public int getSens() {
                      return getSharedPreferences(GuardService.PREFS, MODE_PRIVATE).getInt(GuardService.KEY_SENS, 6);
                  }

                  @JavascriptInterface public void setSens(int v) {
                      int c = Math.max(1, Math.min(10, v));
                      getSharedPreferences(GuardService.PREFS, MODE_PRIVATE).edit().putInt(GuardService.KEY_SENS, c).apply();
                  }

                  @JavascriptInterface public void testSound() {
                      runOnUiThread(() -> {
                          try {
                              ToneGenerator tg = new ToneGenerator(AudioManager.STREAM_MUSIC, 100);
                              tg.startTone(ToneGenerator.TONE_CDMA_ALERT_CALL_GUARD, 1500);
                              handler.postDelayed(tg::release, 1800);
                          } catch (Exception ignored) { }
                      });
                  }

                  @JavascriptInterface public boolean batteryOk() {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      return pm.isIgnoringBatteryOptimizations(getPackageName());
                  }

                  @SuppressLint("BatteryLife")
                  @JavascriptInterface public void askBattery() {
                      runOnUiThread(() -> {
                          try {
                              startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                      Uri.parse("package:" + getPackageName())));
                          } catch (Exception e) {
                              startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                          }
                      });
                  }
              }
          }
          GT_EOF_3
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_fg.xml")"
          cat > 'app/src/main/res/drawable/ic_fg.xml' <<'GT_EOF_4'
