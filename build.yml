          package fr.gardetel.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          /** Relance la sentinelle auto après un redémarrage du téléphone. */
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent i) {
                  if (!Intent.ACTION_BOOT_COMPLETED.equals(i.getAction())) return;
                  if (!GuardService.isAuto(c)) return;
                  try {
                      c.startForegroundService(new Intent(c, GuardService.class).setAction(GuardService.ACTION_AUTO_ON));
                  } catch (Exception ignored) { }
              }
          }
