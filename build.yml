name: Construire l'APK Garde Tél

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer le projet Android
        run: |
          mkdir -p "$(dirname "app/build.gradle")"
          cat > 'app/build.gradle' <<'GT_EOF_0'
          plugins { id 'com.android.application' }

          android {
              namespace 'fr.gardetel.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'fr.gardetel.app'
                  minSdk 29
                  targetSdk 34
                  versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
                  versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
              }
              signingConfigs {
                  fixed {
                      storeFile file('gt.keystore')
                      storePassword 'gardetel'
                      keyAlias 'gt'
                      keyPassword 'gardetel'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixed }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GT_EOF_0
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > 'app/src/main/AndroidManifest.xml' <<'GT_EOF_1'
