          cat > 'app/src/main/java/fr/gardetel/app/GardeWidget.java' <<'GT_EOF_4'
          package fr.gardetel.app;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;

          /** Widget d'écran d'accueil : affiche l'état, un appui active / désactive / coupe l'alarme. */
          public class GardeWidget extends AppWidgetProvider {

              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  m.updateAppWidget(ids, build(c));
              }

              public static void refresh(Context c) {
                  try {
                      AppWidgetManager m = AppWidgetManager.getInstance(c);
                      int[] ids = m.getAppWidgetIds(new ComponentName(c, GardeWidget.class));
                      if (ids != null && ids.length > 0) m.updateAppWidget(ids, build(c));
                  } catch (Exception ignored) { }
              }

              private static RemoteViews build(Context c) {
                  RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_garde);
                  String icon, label, hint;
                  int bg;
                  switch (GuardService.state) {
                      case PAUSED: icon = "🔵"; label = "SENTINELLE"; hint = "En pause, s'arme à la veille"; bg = R.drawable.widget_bg_paused; break;
                      case ARMING: icon = "🟡"; label = "ARMEMENT…"; hint = "Touche pour désactiver"; bg = R.drawable.widget_bg_arming; break;
                      case ACTIVE: icon = "🟢"; label = "ACTIVE"; hint = "Touche pour désactiver"; bg = R.drawable.widget_bg_active; break;
                      case ALARM:  icon = "🚨"; label = "ALERTE"; hint = "Touche pour couper l'alarme"; bg = R.drawable.widget_bg_alarm; break;
                      default:     icon = "🛡️"; label = "INACTIVE"; hint = "Touche pour activer"; bg = R.drawable.widget_bg_off; break;
                  }
                  v.setTextViewText(R.id.w_icon, icon);
                  v.setTextViewText(R.id.w_state, label);
                  v.setTextViewText(R.id.w_hint, hint);
                  v.setInt(R.id.w_root, "setBackgroundResource", bg);

                  Intent i = new Intent(c, GuardService.class).setAction(GuardService.ACTION_TOGGLE);
                  PendingIntent pi = PendingIntent.getForegroundService(c, 10, i,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  v.setOnClickPendingIntent(R.id.w_root, pi);
                  return v;
              }
          }
