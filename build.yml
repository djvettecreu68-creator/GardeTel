          package fr.gardetel.app;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Intent;
          import android.view.accessibility.AccessibilityEvent;

          /** Service d'accessibilité utilisé uniquement pour mettre l'écran en veille (comme le bouton power). */
          public class LockService extends AccessibilityService {

              private static volatile LockService inst;

              public static boolean enabled() { return inst != null; }

              public static boolean lock() {
                  LockService s = inst;
                  return s != null && s.performGlobalAction(GLOBAL_ACTION_LOCK_SCREEN);
              }

              @Override protected void onServiceConnected() { super.onServiceConnected(); inst = this; }
              @Override public void onAccessibilityEvent(AccessibilityEvent e) { }
              @Override public void onInterrupt() { }

              @Override public boolean onUnbind(Intent i) { inst = null; return super.onUnbind(i); }
              @Override public void onDestroy() { inst = null; super.onDestroy(); }
          }
